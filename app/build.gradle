import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-kapt'
    id 'com.google.devtools.ksp'
}

apply from: rootProject.file('dependencies.gradle')

def apiPropertiesFile = rootProject.file("api.properties")
def apiProperties = new Properties()
apiProperties.load(new FileInputStream(apiPropertiesFile))

android {

    namespace 'od.konstantin.myapplication'

    repositories {
        maven { url 'https://jitpack.io' }
    }

    compileSdk 35

    defaultConfig {
        applicationId "od.konstantin.myapplication"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "BASE_URL", apiProperties['BASE_URL']
        buildConfigField "String", "MOVIES_API_KEY", apiProperties['MOVIES_API_KEY']
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        languageVersion = KotlinVersion.KOTLIN_2_0
        jvmTarget = JvmTarget.JVM_21

        allWarningsAsErrors = false
        freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
    }
}

dependencies {
    implementation deps.kotlin.coroutines
    implementation deps.kotlin.serialization
    implementation deps.core_ktx
    implementation deps.fragment_ktx
    implementation deps.appcompat
    implementation deps.material
    implementation deps.constraintlayout
    implementation deps.swiperefreshlayout
    implementation deps.lifecycle.viewmodel
    implementation deps.lifecycle.livedata
    implementation deps.lifecycle.lifecycle
    implementation deps.simple_rating_bar
    implementation deps.glide
    implementation deps.logging_interceptor
    implementation deps.paging.paging
    implementation deps.worker
    implementation deps.lottie

    // Retrofit
    implementation deps.retrofit.retrofit
    implementation deps.retrofit.kotlin_converter

    // Dagger
    implementation deps.dagger.dagger
    kapt deps.dagger.compiler

    // Room
    implementation deps.room.room
    implementation deps.room.ktx
    ksp deps.room.compiler
}